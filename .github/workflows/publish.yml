name: Publish to npm

# Publishes whatever version package.json names, when it lands on master.
#
# So a release is a version bump in a pull request: merge it and the package
# goes out. Nothing to remember afterwards, no tag to push by hand, and the
# thing that was reviewed is the thing that ships.
#
# Every push to master runs this, including the many that change nothing about
# the package — so the first job asks npm whether this version already exists
# and the second one is skipped if it does. That guard is what makes the trigger
# safe: without it every merge would attempt a republish and fail with a 403,
# and a workflow that is expected to fail is a workflow nobody reads.
#
# This deliberately does not wait on the CI workflow. Branch protection
# requiring its two checks is what keeps an unreviewed commit off master in the
# first place; belt and braces, the publish job runs the suite again, and
# `npm test` contains the golden comparison that pins the wire protocol byte for
# byte against fixtures the Python implementation produced.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every check and pack the tarball, but do not publish'
        type: boolean
        default: false

permissions:
  # `contents: read` would do for the publish itself. The write is for the tag
  # and the GitHub release at the end.
  contents: write
  # Provenance: npm records a signed attestation tying the tarball to this
  # workflow, this repository and this commit, which is what puts the "Built and
  # signed on GitHub Actions" badge on the package page. Needs the `repository`
  # field in package.json to match, which it does.
  id-token: write

# Two publishes of one package at once is never what anybody wanted, and a
# half-finished one is worse than a slow one — so queue rather than cancel.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  decide:
    name: Is this version new?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      published: ${{ steps.check.outputs.published }}
    steps:
      - uses: actions/checkout@v4

      # No setup-node: this reads one JSON field and asks the registry a
      # question, which the runner's own Node and npm do perfectly well. The
      # publish job below pins the version that matters.
      - id: check
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # `npm view` exits non-zero for a version that does not exist — and
          # for a package that has never been published at all, which is where
          # this repository starts.
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$name@$version is already on npm. Nothing to do."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$name@$version is not on npm. Publishing."
          fi

  publish:
    name: Publish
    needs: decide
    if: needs.decide.outputs.published == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags, so the release step can tell whether this one already exists.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # Writes the .npmrc that makes npm honour NODE_AUTH_TOKEN. Without it
          # `npm publish` fails with ENEEDAUTH however the secret is set — which
          # is why neither of the other two workflows needs this line and this
          # one does.
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # The same checks CI runs, because nothing else stands between a merge and
      # the registry. `npm test` is the one that matters most: the golden suite
      # compares complete print jobs byte for byte, so a protocol regression
      # cannot reach npm even if somebody merged past a red build.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # What the tarball would contain, in the log, before anything is uploaded.
      # `files` in package.json is an allowlist, and this is the only place a
      # mistake in it becomes visible.
      - name: Show what would be published
        run: npm pack --dry-run

      # `--access public` is required, not optional: the package is scoped and
      # scoped packages are private by default, so without it a first publish
      # either asks for a paid plan or quietly ships something nobody can
      # install.
      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Afterwards, so a failed publish never leaves a tag claiming a version
      # that did not ship. Re-running a run that published but failed here is
      # safe: `decide` skips the publish and this picks up where it stopped.
      - name: Tag and release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          tag="v$VERSION"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "::notice::$tag already exists."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$tag" -m "$tag"
          git push origin "$tag"

          # The CHANGELOG section for this version: everything between
          # `## [1.2.3]` and the next `## ` heading. A release whose notes were
          # still sitting under `[Unreleased]` at merge time falls back to the
          # commit list, which is honest rather than empty.
          notes=$(awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { collecting = 1; next }
            collecting && /^## / { exit }
            collecting { print }
          ' CHANGELOG.md)

          if [ -n "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            printf '%s\n' "$notes" | gh release create "$tag" --title "$tag" --notes-file -
          else
            gh release create "$tag" --title "$tag" --generate-notes
          fi
